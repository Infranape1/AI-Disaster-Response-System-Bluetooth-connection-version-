<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Disaster Command Center</title>
<style>
  :root{--bg:#0b1016;--card:#141c26;--line:#26333f;--txt:#eaf0f6;--dim:#8b9bac;
        --red:#e03131;--amber:#f0a020;--green:#28c76f;--blue:#3b82f6}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;
       background:var(--bg);color:var(--txt)}
  header{background:#0e141c;border-bottom:1px solid var(--line);padding:18px 24px;
         display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:19px;margin:0;letter-spacing:.5px}
  header .sub{color:var(--dim);font-size:13px}
  .status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
  .dot.ok{background:var(--green)}.dot.bad{background:var(--red)}
  main{padding:22px;max-width:1150px;margin:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .label{color:var(--dim);font-size:11px;letter-spacing:.14em;font-weight:700}
  .big{font-size:32px;font-weight:800;margin-top:6px}
  .panel{margin-top:22px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  button{padding:9px 16px;border:1px solid var(--line);background:#1b2632;color:var(--txt);
         border-radius:10px;cursor:pointer;font-size:13px}
  button:hover{background:#26333f}
  .incident{background:var(--card);border:1px solid var(--line);border-radius:12px;
            padding:14px 16px;margin-bottom:10px;border-left-width:5px}
  .CRITICAL{border-left-color:var(--red)}
  .HIGH{border-left-color:var(--amber)}
  .MEDIUM{border-left-color:var(--blue)}
  .LOW{border-left-color:var(--dim)}
  .incident b{font-size:14px}
  .incident p{margin:7px 0;font-size:14px;line-height:1.45}
  .incident small{color:var(--dim);font-size:12px}
  .empty{color:var(--dim);padding:22px 0;font-size:14px;line-height:1.6}
  code{background:#0e141c;padding:2px 6px;border-radius:5px;font-size:12px}
</style>
</head>
<body>

<header>
  <div>
    <h1>AI DISASTER COMMAND CENTER</h1>
    <div class="sub">Emergency reports synchronized from offline hubs</div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="conn">Connecting…</span></div>
</header>

<main>
  <div class="grid">
    <div class="card"><div class="label">ACTIVE HUBS</div><div class="big" id="hubs">0</div></div>
    <div class="card"><div class="label">CRITICAL</div><div class="big" id="critical" style="color:var(--red)">0</div></div>
    <div class="card"><div class="label">RESCUE REQUESTS</div><div class="big" id="rescue">0</div></div>
    <div class="card"><div class="label">MEDICAL REQUESTS</div><div class="big" id="medical">0</div></div>
    <div class="card"><div class="label">TOTAL REPORTS</div><div class="big" id="total">0</div></div>
  </div>

  <div class="card panel">
    <div class="row">
      <h2 style="margin:0;font-size:16px;flex:1">Incident Intelligence</h2>
      <label style="font-size:13px;color:var(--dim)">
        <input type="checkbox" id="auto" checked> Auto-refresh
      </label>
      <button onclick="load()">Refresh now</button>
    </div>
    <div id="incidents"><div class="empty">Loading…</div></div>
  </div>
</main>

<script>
/*
 * When this page is served by the backend the relative URL just works,
 * including from a phone browser. Opening the file directly from disk
 * has no origin to fall back on, so try the local machine instead.
 */
const API = location.protocol.startsWith('http')
  ? ''
  : 'http://127.0.0.1:8000';

function setStatus(ok, text){
  document.getElementById('dot').className = 'dot ' + (ok ? 'ok' : 'bad');
  document.getElementById('conn').textContent = text;
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function load(){
  try{
    const response = await fetch(API + '/incidents', {cache:'no-store'});
    if(!response.ok) throw new Error('HTTP ' + response.status);
    const list = await response.json();

    const count = t => list.filter(x => (x.type||'').toUpperCase() === t).length;

    document.getElementById('total').textContent    = list.length;
    document.getElementById('critical').textContent = list.filter(x => x.severity === 'CRITICAL').length;
    document.getElementById('rescue').textContent   = count('RESCUE');
    document.getElementById('medical').textContent  = count('MEDICAL');
    document.getElementById('hubs').textContent     = new Set(list.map(x => x.hubId)).size;

    document.getElementById('incidents').innerHTML = list.length
      ? list.map(x => `
          <div class="incident ${esc(x.severity)}">
            <b>${esc(x.disaster)} · ${esc(x.severity)}</b>
            <p>${esc(x.content)}</p>
            <small>Hub ${esc(x.hubId)} · Node ${esc(x.senderNodeId)}
              · Confidence ${Math.round((x.confidence||0)*100)}%
              · ${esc((x.syncedAt||'').replace('T',' ').slice(0,19))} UTC</small>
          </div>`).join('')
      : `<div class="empty">No reports received yet.<br>
           Send one from the app: <b>Create Emergency Report → SEND REPORT</b>.</div>`;

    setStatus(true, 'Connected · ' + list.length + ' report(s)');

  }catch(error){
    setStatus(false, 'Backend unavailable');
    document.getElementById('incidents').innerHTML =
      `<div class="empty">Cannot reach the backend.<br><br>
        Start it with <code>python run_server.py</code> in the
        <code>backend</code> folder, then open
        <code>http://&lt;your-pc-ip&gt;:8000/</code>.</div>`;
  }
}

load();
setInterval(() => { if(document.getElementById('auto').checked) load(); }, 4000);
</script>
</body>
</html>
